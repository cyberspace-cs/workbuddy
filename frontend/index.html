<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkBuddy · 多智能体编排引擎</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <!-- 侧边控制台 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand reveal">
        <div class="logo">
          <span class="logo-mark">WB</span>
          <span class="logo-orbit" aria-hidden="true"></span>
        </div>
        <div class="brand-text">
          <div class="brand-name">WorkBuddy</div>
          <div class="brand-sub">多智能体编排引擎</div>
        </div>
      </div>

      <div class="panel reveal">
        <label class="field-label" for="sessionId">会话 ID</label>
        <input id="sessionId" class="input" value="default" spellcheck="false" />
      </div>

      <div class="panel reveal">
        <label class="field-label" for="providerSelect">模型 Provider</label>
        <div class="select-wrap">
          <select id="providerSelect" class="input select"></select>
        </div>
        <label class="field-label" for="modelSelect" style="margin-top:10px">具体模型</label>
        <div class="select-wrap">
          <select id="modelSelect" class="input select"></select>
        </div>
      </div>

      <div class="panel reveal">
        <label class="field-label">运行模式</label>
        <div class="seg" id="modeSeg">
          <button class="seg-btn active" data-mode="auto">自动</button>
          <button class="seg-btn" data-mode="agent">单专家</button>
          <button class="seg-btn" data-mode="swarm">智囊团</button>
          <span class="seg-pill" aria-hidden="true"></span>
        </div>
      </div>

      <div class="panel reveal" id="agentPanel" hidden>
        <label class="field-label" for="agentSelect">选择专家</label>
        <div class="select-wrap">
          <select id="agentSelect" class="input select"></select>
        </div>
      </div>

      <div class="panel reveal" id="swarmPanel" hidden>
        <label class="field-label">参与专家（智囊团）</label>
        <div id="expertList" class="checks"></div>
      </div>

      <button id="resetBtn" class="btn-ghost reveal">清空会话</button>

      <div class="hint reveal">
        提示：选好 Provider/模型后直接提问即走真实 LLM；<br/>
        「智囊团」会并行多位专家并置信加权综合；<br/>
        让工程师「写一段 HTML」可在右侧实时预览。
      </div>
    </aside>

    <!-- 对话主区 -->
    <main class="chat">
      <header class="chat-head">
        <button id="menuToggle" class="icon-btn" aria-label="切换侧栏">☰</button>
        <span id="modeBadge" class="badge">自动路由</span>
        <span id="providerBadge" class="badge mono">provider</span>
        <span id="modelBadge" class="badge mono muted">model</span>
        <span id="status" class="status"></span>
      </header>

      <div id="messages" class="messages"></div>

      <div class="composer">
        <textarea id="input" class="composer-input" rows="2" placeholder="给 WorkBuddy 发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="sendBtn" class="btn-primary">发送</button>
      </div>
    </main>

    <!-- 右：执行轨迹 + Artifact -->
    <aside class="right" id="rightPanel">
      <div class="right-head">执行轨迹 / 产出</div>
      <div id="activity" class="activity">
        <div class="empty">暂无轨迹。发送消息后，工具调用、专家思考与置信度会实时出现在这里。</div>
      </div>
      <div class="right-head">Artifact 预览</div>
      <div id="artifacts" class="artifacts">
        <div class="empty">暂无产物。让助手生成代码 / HTML 即可在此预览。</div>
      </div>
    </aside>
  </div>

  <script src="/app.js"></script>
</body>
</html>
